spring:
  application:
    name: card-product-management

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
