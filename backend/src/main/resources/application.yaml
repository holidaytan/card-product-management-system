spring:
  application:
    name: card-product-management

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dbo

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: dbo
    clean-disabled: true
    validate-migration-naming: true

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kuala_Lumpur}
  exchange-rates:
    provider-base-url: ${EXCHANGE_RATE_PROVIDER_BASE_URL:https://api.frankfurter.dev}
    connect-timeout: ${EXCHANGE_RATE_CONNECT_TIMEOUT:2s}
    read-timeout: ${EXCHANGE_RATE_READ_TIMEOUT:5s}
    currency-cache-ttl: ${EXCHANGE_RATE_CURRENCY_CACHE_TTL:24h}
    rate-cache-ttl: ${EXCHANGE_RATE_CACHE_TTL:1h}

logging:
  file:
    name: ${LOG_FILE:logs/card-product-management.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:logs/card-product-management.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never
