spring:
  application:
    name: card-product-management

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dbo

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: dbo
    clean-disabled: true
    validate-migration-naming: true

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kuala_Lumpur}

logging:
  file:
    name: ${LOG_FILE:logs/card-product-management.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:logs/card-product-management.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 7

server:
  error:
    include-stacktrace: never
    include-message: never
